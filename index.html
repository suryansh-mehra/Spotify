<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>
<body>
    <div class="container flex">
        <div class="left flex">
            <div class="home m-1 rounded">

                <img class="invert close" src="img/cancel-01-stroke-rounded.svg" alt="">

                <div class="logo p-1">
                    <img width="100px" class="invert" src="img/logo.svg" alt="">
                    <ul>
                        <li><img class="invert" src="img/home.svg" alt="Home">Home</li>
                        <li><img class="invert" src="img/search.svg" alt="Search">Search</li>
    
                    </ul>
                </div>
                
            </div>
            <div class="library p-1 rounded">
                <div class="heading flex">
                    <img class="invert"src="img/playlist.svg" alt="">
                    <h2>Library</h2>
                </div>

                <div class="songList">
                    <ul>
                        
                    </ul>
                </div>

                <div class="footer flex">
                     <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>

                </div>
            </div>
        </div>
        <div class="right ">
        
            <div class="header flex  p-1">

               
                 
              <div class="nav flex">
                <img class = "invert hamburger" src="img/menu-01-stroke-rounded.svg" alt=""> 
                <img class = "invert" src="img/arrow-left-big-stroke-rounded.svg" alt="left">
                <img class = "invert" src="img/arrow-right-big-stroke-rounded.svg" alt="right">
             </div>
             <div class="buttons">
                <button>Sign up</button>
                <button>Login</button>
             </div>

            </div>

            <div class="spotifyPlaylist">
                <h2>Spotify Playlist</h2>

                <div class="cardContainer flex">
                    
                </div>
                
            </div>

            <div class="playBar flex">

                <div class="songInfo">
                    
                </div>

                <div class="playButtons">
                 <img id="previous" class = "invert" src="img/prevsong.svg" alt="previous">
                 <img  id="play" class = "invert" src="img/play.svg" alt="play">
                 <img id="next" class = "invert" src="img/nextsong.svg" alt="next">
                </div>
                

                <div class="volTime flex">

                    <div class="songDuration">
                        
                    </div>
                    
                    <div class="volume">
                    <img class = "invert vol" src="img/volume-high-stroke-rounded.svg" alt="volume">
                    <input type="range">
                    </div>

                </div>
                
                <div class="seekBar">
                    <div class="circle"></div>
                </div>
                

            </div>

        </div>
    </div>
    
<script src="js/script.js"></script>

</body>
</html>
